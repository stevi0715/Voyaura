<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h2>Welcome to the Admin Dashboard</h2>
    <p>If you can see this, you are logged in.</p>

    <textarea id="noticeText" rows="6" placeholder="Type your offer here..."></textarea>
    <button onclick="saveNotice()">Save Offer</button>
    <button onclick="logout()">Logout</button>

    <h3>Saved Offers</h3>
    <div id="offersList"></div>

</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    import {
        getFirestore,
        collection,
        addDoc,
        doc,
        getDocs,
        deleteDoc
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAdLupniZJXhs0Q7zn8O66s9WrOg1yLrv4",
        authDomain: "voyaura-admin.firebaseapp.com",
        projectId: "voyaura-admin",
        storageBucket: "voyaura-admin.firebasestorage.app",
        messagingSenderId: "903202312127",
        appId: "1:903202312127:web:a8127b004296b09d7b1b0a",
        measurementId: "G-PVXNFXY8GW"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    onAuthStateChanged(auth, user => {
        if (!user) {
            window.location.href = "login.html";
        } else {
            loadOffers();
        }
    });

    // Save a NEW offer
    async function saveNotice() {
        const text = document.getElementById("noticeText").value;

        await addDoc(collection(db, "offers"), {
            text: text,
            createdAt: new Date().toISOString()
        });

        document.getElementById("noticeText").value = "";
        loadOffers();
        alert("Offer saved!");
    }

    // Load ALL offers
    async function loadOffers() {
        const querySnapshot = await getDocs(collection(db, "offers"));
        const list = document.getElementById("offersList");

        list.innerHTML = "";

        querySnapshot.forEach(docSnap => {
            const data = docSnap.data();
            const id = docSnap.id;

            const div = document.createElement("div");
            div.className = "offer-box";  // ⭐ MOBILE-FRIENDLY CLASS

            div.innerHTML = `
                <p><strong>Offer:</strong> ${data.text}</p>
                <p><em>Created:</em> ${new Date(data.createdAt).toLocaleString()}</p>
                <button onclick="deleteOffer('${id}')">Delete Offer</button>
            `;

            list.appendChild(div);
        });
    }

    // Delete an offer
    async function deleteOffer(id) {
        await deleteDoc(doc(db, "offers", id));
        loadOffers();
    }

    // Make functions global
    window.saveNotice = saveNotice;
    window.loadOffers = loadOffers;
    window.deleteOffer = deleteOffer;

    window.logout = function () {
        signOut(auth).then(() => {
            window.location.href = "login.html";
        });
    };
</script>

</body>
</html>
