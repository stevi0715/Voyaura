<!DOCTYPE html>
<html>
<head>
    <title>Voyaura Enquiry</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <img src="logo.png" alt="Voyaura Logo" class="logo">
    <h1>Voyaura</h1>
    <p>Find More. Travel Better.</p>
</header>

<div class="container">

    <section class="box">
        <h2>Send an Enquiry</h2>

        <form class="enquiry-form" action="https://api.web3forms.com/submit" method="POST">
            <input type="hidden" name="access_key" value="c8d93aed-36ae-4e20-a718-286d86068f24">

            <label>Name</label>
            <input type="text" name="name" required>

            <label>Email</label>
            <input type="email" name="email" required>

            <label>Your Message</label>
            <textarea rows="5" name="message" required></textarea>

            <button class="button">Submit</button>
        </form>
    </section>

    <a class="home-btn" href="index.html">🏠 Home</a>

</div>

<footer>
    <p>© 2026 Voyaura</p>
</footer>

</body>
</html>
