<!DOCTYPE html>
<html>
<head>
    <title>Voyaura Enquiry</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <img src="logo.png" alt="Voyaura Logo" class="logo">
    <h1>Voyaura</h1>
    <p>Find More. Travel Better.</p>
</header>

<section class="box">
    <h2>Send an Enquiry</h2>

    <form class="enquiry-form" onsubmit="sendEnquiry(event)">
        <label>Name</label>
        <input type="text" id="name" required>

        <label>Email</label>
        <input type="email" id="email" required>

        <label>Your Message</label>
        <textarea rows="5" id="message" required></textarea>

        <button class="button">Submit</button>
    </form>
</section>

<a class="home-btn" href="index.html">🏠 Home</a>

<footer>
    <p>© 2026 Voyaura</p>
</footer>

<!-- EmailJS -->
<script src="https://cdn.emailjs.com/dist/email.min.js"></script>
<script>
    (function(){
        emailjs.init("C2HylClAlkh3z8ibh"); // Your PUBLIC KEY
    })();

    function sendEnquiry(event) {
        event.preventDefault(); // stop page reload

        const name = document.getElementById("name").value;
        const email = document.getElementById("email").value;
        const message = document.getElementById("message").value;

        emailjs.send("service_7h3bf7i", "template_kfvuf17", {
            from_name: name,
            reply_to: email,
            message: message
        })
        .then(() => {
            alert("Your enquiry has been sent!");
            document.querySelector(".enquiry-form").reset();
        })
        .catch((error) => {
            console.error("EmailJS error:", error);
            alert("Failed to send enquiry.");
        });
    }
</script>

</body>
</html>
